name: CI

# Security-audit finding SEC-18: the tracked repository had no CI at all, and the Dockerfile
# packages a release image with -DskipTests -- a reproducible build could succeed while a
# security regression test failed, with nothing to catch it before the image shipped. This is
# the required gate: the full Java test suite (which includes every security-audit regression
# test added across the F01-F20 and SEC-01-SEC-16 remediation passes) must pass against a real
# PostgreSQL instance before a release image is even built.
on:
  # This repository's actual default branch is `claude/telegram-mcp-consent-d67byz`, not
  # `main`/`master` -- every change lands there by a direct push with no pull request. A
  # `branches: [main, master]` filter here would mean this workflow's push trigger never
  # fires on this repository at all, silently defeating SEC-18's whole premise ("the full
  # test suite ... must pass ... before a release image is even built"). Naming the real
  # default branch explicitly, alongside the conventional ones for a future rename or fork.
  push:
    branches: [main, master, claude/telegram-mcp-consent-d67byz]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Java 21, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tgmcp
          POSTGRES_PASSWORD: tgmcp
          POSTGRES_DB: tgmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tgmcp -d tgmcp_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run the full test suite
        env:
          TGMCP_TEST_DB_URL: jdbc:postgresql://localhost:5432/tgmcp_test
          TGMCP_TEST_DB_USER: tgmcp
          TGMCP_TEST_DB_PASSWORD: tgmcp
        run: mvn -B test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 14

  docker-build:
    name: Build release image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (not pushed)
        run: docker build -t telegram-consent-mcp:ci .

      # Security-audit findings SEC-18/SEC-R11: dependency and container scanning. Blocking
      # on CRITICAL/HIGH findings that have a known fix available (ignore-unfixed: true) --
      # the "day-one noise" concern that originally kept this report-only was specifically
      # about findings with no fix to apply yet; a finding a fixed base image or dependency
      # bump would resolve has no such excuse, so failing the build on those costs nothing
      # while catching real, actionable regressions before a release image ships.
      - name: Scan image for known, fixable vulnerabilities (blocking)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: telegram-consent-mcp:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Report-only pass over everything else (including not-yet-fixable findings), purely
      # for visibility -- never blocks the build.
      - name: Scan image for known vulnerabilities (report-only, includes unfixed)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: telegram-consent-mcp:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

  secret-scan:
    name: Scan for committed secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Security-audit finding SEC-R12: scans the full commit history, not just the
          # current working tree, so a secret committed and later removed is still caught.
          fetch-depth: 0

      # Runs the open-source gitleaks CLI directly via its official image rather than a
      # third-party GitHub Action wrapper, so this has no license requirement regardless of
      # repository visibility.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml -v --redact --exit-code 1
