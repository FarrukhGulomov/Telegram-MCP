services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tgmcp
      POSTGRES_USER: tgmcp
      # Security-audit finding SEC-12: no development fallback here on purpose -- a
      # database holding real Telegram content and consent evidence must never start
      # under a well-known, guessable password. Compose refuses to start at all
      # (rather than silently accepting a weak default) until TGMCP_DB_PASSWORD is set;
      # copy .env.example to .env and change it there.
      POSTGRES_PASSWORD: ${TGMCP_DB_PASSWORD:?Set TGMCP_DB_PASSWORD (see .env.example) before starting}
    ports:
      # Security-audit finding SEC-12: bound to loopback by default -- this port existing
      # at all is a local-development convenience (so a host-side psql/GUI client can
      # connect), not something a real deployment should expose beyond its own host.
      # Override TGMCP_DB_BIND explicitly (e.g. to a private network address) only if you
      # have a specific, reviewed reason a remote client needs to reach this port directly.
      - "${TGMCP_DB_BIND:-127.0.0.1}:${TGMCP_DB_PORT:-5432}:5432"
    volumes:
      - tgmcp-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgmcp -d tgmcp"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TGMCP_DB_URL: jdbc:postgresql://db:5432/tgmcp
      TGMCP_DB_USER: tgmcp
      TGMCP_DB_PASSWORD: ${TGMCP_DB_PASSWORD:?Set TGMCP_DB_PASSWORD (see .env.example) before starting}
      # Default is the fully synthetic adapter: no Telegram account is contacted.
      TGMCP_TELEGRAM_ADAPTER: ${TGMCP_TELEGRAM_ADAPTER:-MOCK}
      TGMCP_SEED_DEMO: ${TGMCP_SEED_DEMO:-true}
      TGMCP_DEMO_EMAIL: ${TGMCP_DEMO_EMAIL:-owner@demo.invalid}
      TGMCP_DEMO_PASSWORD: ${TGMCP_DEMO_PASSWORD:-demo-password}
      TGMCP_OAUTH_ISSUER: ${TGMCP_OAUTH_ISSUER:-http://localhost:8080}
      TGMCP_PUBLIC_BASE_URL: ${TGMCP_PUBLIC_BASE_URL:-http://localhost:8080}
      TGMCP_MCP_RESOURCE: ${TGMCP_MCP_RESOURCE:-http://localhost:8080/mcp}
      # Keys live outside the database. Without them the app derives an insecure
      # development key and logs a warning.
      TGMCP_SESSION_ENCRYPTION_KEY: ${TGMCP_SESSION_ENCRYPTION_KEY:-}
      TGMCP_CURSOR_SIGNING_KEY: ${TGMCP_CURSOR_SIGNING_KEY:-}
      TGMCP_COOKIE_SECURE: ${TGMCP_COOKIE_SECURE:-false}
    ports:
      - "${TGMCP_PORT:-8080}:8080"

volumes:
  tgmcp-db:
