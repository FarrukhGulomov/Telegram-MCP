<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in with Telegram — Telegram Consent MCP</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centered">
<div class="auth-shell">
  <div class="lang-switch-row">
    <div class="lang-switch">
      <a href="#" data-lang="en" th:classappend="${#locale.language == 'en'} ? 'is-active'">EN</a>
      <a href="#" data-lang="uz" th:classappend="${#locale.language == 'uz'} ? 'is-active'">UZ</a>
      <a href="#" data-lang="ru" th:classappend="${#locale.language == 'ru'} ? 'is-active'">RU</a>
    </div>
  </div>

  <span class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
  </span>
  <h1 th:text="#{login.telegramCode.heading}">Sign in with a Telegram code</h1>

  <main class="card">
    <p class="muted" th:text="#{login.telegramCode.hint}">Enter your email or Telegram username; a code will be sent to your Telegram.</p>

    <div class="flash ok" th:if="${message}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
      <span th:text="${message}"></span>
    </div>

    <form th:action="@{/login/telegram-code}" method="post" data-guard-resubmit>
      <label for="identifier" th:text="#{login.telegramCode.identifierLabel}">Email or Telegram username</label>
      <input id="identifier" name="identifier" type="text" required autofocus autocomplete="username">
      <button type="submit" th:text="#{login.telegramCode.button}">Send code</button>
    </form>

    <p class="muted auth-note">
      <a th:href="@{/login}" th:text="#{login.telegramCode.backToPassword}">Sign in with a password instead</a>
    </p>
  </main>
</div>
<script src="/js/forms.js" defer></script>
<script src="/js/lang.js" defer></script>
</body>
</html>
