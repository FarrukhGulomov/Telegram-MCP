<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Telegram — Telegram Consent MCP</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centered">
<div class="auth-shell">
  <div class="lang-switch-row">
    <div class="lang-switch">
      <a href="#" data-lang="en" th:classappend="${#locale.language == 'en'} ? 'is-active'">EN</a>
      <a href="#" data-lang="uz" th:classappend="${#locale.language == 'uz'} ? 'is-active'">UZ</a>
      <a href="#" data-lang="ru" th:classappend="${#locale.language == 'ru'} ? 'is-active'">RU</a>
    </div>
  </div>

  <span class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
  </span>
  <h1 th:text="#{register.linkTelegram.heading}">Link your Telegram account</h1>

  <main class="card">
    <p class="muted" th:text="#{register.linkTelegram.hint}">Open the bot and press Start; this page continues automatically once it's linked.</p>

    <a th:href="${deepLink}" th:text="#{register.linkTelegram.button}" data-link-telegram-deeplink>Open Telegram</a>
    <p class="hint" id="link-telegram-status" th:text="#{register.linkTelegram.waiting}">Waiting…</p>
  </main>
</div>
<script th:attr="data-link-token=${token}" id="link-telegram-config"></script>
<script src="/js/link-telegram.js" defer></script>
<script src="/js/lang.js" defer></script>
</body>
</html>
