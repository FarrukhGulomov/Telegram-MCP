<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your workspace — Telegram Consent MCP</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centered">
<div class="auth-shell">
  <div class="lang-switch-row">
    <div class="lang-switch">
      <a href="#" data-lang="en" th:classappend="${#locale.language == 'en'} ? 'is-active'">EN</a>
      <a href="#" data-lang="uz" th:classappend="${#locale.language == 'uz'} ? 'is-active'">UZ</a>
      <a href="#" data-lang="ru" th:classappend="${#locale.language == 'ru'} ? 'is-active'">RU</a>
    </div>
  </div>

  <span class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
  </span>
  <h1 th:text="#{register.heading}">Create your workspace</h1>

  <main class="card">
    <p class="muted" th:text="#{register.intro}">Set up your workspace in a minute — no invite needed.</p>

    <div class="flash err" th:if="${error}" th:text="${error}"></div>

    <form th:if="${telegramLoginEnabled}" th:action="@{/register}" method="post" data-guard-resubmit>
      <label for="workspaceName" th:text="#{register.workspaceName}">Workspace name</label>
      <input id="workspaceName" name="workspaceName" type="text" maxlength="200" required
             th:value="${workspaceName}">

      <label for="email" th:text="#{register.email}">Email</label>
      <input id="email" name="email" type="email" required autocomplete="username" th:value="${email}">

      <button type="submit" th:text="#{register.createAccount}">Create account</button>
    </form>
    <p class="hint" th:if="${telegramLoginEnabled}" th:text="#{register.telegramLinkNotice}">You'll link a Telegram account as the next step.</p>

    <div class="flash err" th:if="${!telegramLoginEnabled and error == null}">
      <span th:text="#{register.unavailable}">Registration is not available right now.</span>
    </div>

    <p class="muted auth-note">
      <span th:text="#{register.alreadyHaveAccount}">Already have an account?</span>
      <a th:href="@{/login}" th:text="#{register.signInLink}">Sign in</a>
    </p>
  </main>
</div>
<script src="/js/forms.js" defer></script>
<script src="/js/lang.js" defer></script>
</body>
</html>
