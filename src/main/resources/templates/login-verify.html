<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enter the code — Telegram Consent MCP</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="centered">
<div class="auth-shell">
  <div class="lang-switch-row">
    <div class="lang-switch">
      <a href="#" data-lang="en" th:classappend="${#locale.language == 'en'} ? 'is-active'">EN</a>
      <a href="#" data-lang="uz" th:classappend="${#locale.language == 'uz'} ? 'is-active'">UZ</a>
      <a href="#" data-lang="ru" th:classappend="${#locale.language == 'ru'} ? 'is-active'">RU</a>
    </div>
  </div>

  <span class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
  </span>
  <h1 th:text="#{login.verify.heading}">Enter the code</h1>

  <main class="card">
    <p class="muted" th:text="#{login.verify.hint}">We sent a code to your Telegram.</p>

    <div class="flash err" th:if="${error}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
      <span th:text="${error}"></span>
    </div>
    <div class="flash ok" th:if="${message}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
      <span th:text="${message}"></span>
    </div>

    <form th:action="@{/login/verify}" method="post" data-guard-resubmit>
      <label for="code" th:text="#{login.verify.codeLabel}">Code</label>
      <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
             maxlength="6" autofocus required>
      <button type="submit" th:text="#{login.verify.button}">Verify</button>
    </form>

    <form th:action="@{/login/verify/resend}" method="post" data-guard-resubmit>
      <button type="submit" class="link" th:text="#{login.verify.resendButton}">Resend code</button>
    </form>
  </main>
</div>
<script src="/js/forms.js" defer></script>
<script src="/js/lang.js" defer></script>
</body>
</html>
