# --- flash "success" messages ------------------------------------------------------------
chat.select.success=Suhbat tanlandi. Hamma ishtirokchi aynan shu maqsad va provayderlar doirasi uchun rozilik bildirmaguncha, u hech narsa saqlamagan holda AWAITING_CONSENT holatida qoladi.
chat.settings.success=Sozlamalar saqlandi.
chat.consent.success={0} uchun rozilik qayd etildi.
chat.consentRevoke.success=Rozilik bekor qilindi va AI kirishi pauzaga qo'yildi. Suhbatni bekor qilmaguningizcha yoki ma'lumotni o'chirmaguningizcha saqlangan xabarlar qoladi.
chat.activate.success=Suhbat yoqildi. Sinxronlash boshlanadi.
chat.pause.success=Suhbat pauzaga qo'yildi. MCP kirishi darhol bloklandi.
chat.revoke.success=Ruxsat bekor qilindi, rozilik yozuvlari qaytarib olindi va saqlangan xabarlar o'chirildi. AI provayderiga allaqachon oshkor qilingan kontentni o'sha provayderdan qaytarib olib bo'lmaydi.
chat.deleteData.success={0} ta saqlangan xabar o'chirildi. Zaxira nusxalar muddati tugaguncha nusxalarni saqlab qolishi mumkin; saqlash siyosatiga qarang.
chat.sync.result=Sinxronlash: {0} ({1} ta qabul qilindi, {2} ta tahrir qo'llanildi) {3}
connect.discover.success={0} ta suhbat ko'rinmoqda. Aniqlash — bu ruxsat berish emas: suhbat yoqilib, rozilik olinmaguncha hech narsa sinxronlanmaydi.
connect.disconnect.success=Lokal sessiya o'chirildi. Telegramning o'zidagi sessiyani ham bekor qilish uchun Telegramda Sozlamalar → Qurilmalar → Faol sessiyalar bo'limini ochib, shu sessiyani tugating.

