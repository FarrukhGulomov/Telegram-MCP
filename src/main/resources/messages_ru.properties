# --- flash "success" messages ------------------------------------------------------------
chat.select.success=Чат выбран. Он останется в состоянии AWAITING_CONSENT — ничего не сохраняя — пока каждый участник не даст согласие именно на эту цель и круг провайдеров.
chat.settings.success=Настройки сохранены.
chat.consent.success=Согласие для {0} зафиксировано.
chat.consentRevoke.success=Согласие отозвано, доступ AI поставлен на паузу. Сохранённые сообщения останутся, пока вы не отзовёте чат или не удалите данные.
chat.activate.success=Чат включён. Синхронизация начнётся.
chat.pause.success=Чат поставлен на паузу. Доступ через MCP заблокирован немедленно.
chat.revoke.success=Доступ отозван, записи согласия аннулированы, сохранённые сообщения удалены. Контент, уже переданный AI-провайдеру, невозможно отозвать у этого провайдера.
chat.deleteData.success=Удалено сохранённых сообщений: {0}. Резервные копии базы данных могут хранить копии до истечения их срока; см. политику хранения.
chat.sync.result=Синхронизация: {0} (получено {1}, изменений применено {2}) {3}
connect.discover.success=Видно чатов: {0}. Обнаружение — это не разрешение: пока чат не включён и согласие не получено, ничего не синхронизируется.
connect.disconnect.success=Локальная сессия удалена. Чтобы отозвать сессию и внутри самого Telegram, откройте в Telegram Настройки → Устройства → Активные сеансы и завершите эту сессию.

