# --- validation / error messages (thrown as codes, resolved in UiExceptionHandler) -----
validation.dateRange=The approved range must end after it starts
validation.selectProvider=Select at least one provider
validation.selectChatFirst=Select the chat first
validation.unknownProvider=One of the selected providers is not recognized. Please use only the checkboxes provided.
validation.singleConnectionOnly=Another account is already connecting or connected on this server. Only one Telegram connection may be active at a time until per-account isolation is added; disconnect it first.
validation.selfServiceNotAvailable=Self-service consent links aren't implemented yet -- there is no way to verify the participant themselves approved this. Record consent from evidence instead.
validation.demoConsentNotAllowed=Synthetic demo consent cannot be used with a real Telegram account. Record consent from evidence instead.
validation.evidenceRequired=Recording consent on someone's behalf requires an evidence reference.
validation.evidenceTooShort=That evidence reference is too short to be meaningful. Name something checkable: a document link, a message id, a ticket number, or a dated description of the interaction.
validation.activateIncomplete={0} participant(s) have not consented for this purpose, provider scope and consent version.
error.malformedForm=That form was missing a required field or had a value it couldn't understand, so nothing was changed. Please fill in every field and try again.
error.unexpected=Something went wrong. Check the server log.
error.noSuchChat=No such chat
error.chatRevoked=This chat was revoked. Propose it again before activating.
error.accountDisabled=Your account has been disabled. Contact an administrator.
error.roleNoLongerAuthorizes=Your role no longer authorizes this action. Sign in again if it was recently changed.
error.rateLimited=Too many onboarding actions in a short time. Wait a moment and try again.

# --- flash "success" messages produced by the UI controllers ---------------------------
chat.select.success=Chat selected. It will stay in AWAITING_CONSENT — with nothing stored — until every participant has recorded consent for this exact purpose and provider scope.
chat.settings.success=Settings updated.
chat.consent.success=Consent recorded for {0}.
chat.consentRevoke.success=Consent revoked and AI access paused. Stored messages remain until you revoke the chat or delete its data.
chat.activate.success=Chat activated. Synchronisation will begin.
chat.pause.success=Chat paused. MCP access is blocked immediately.
chat.revoke.success=Access revoked, consent records withdrawn and stored messages deleted. Content already disclosed to an AI provider cannot be recalled from that provider.
chat.deleteData.success={0} stored message(s) deleted. Database backups may retain copies until they expire; see the retention policy.
chat.sync.result=Sync: {0} ({1} ingested, {2} revisions) {3}
connect.discover.success={0} chat(s) are visible. Discovery is not authorization: nothing is synchronised until a chat is activated with participant consent.
connect.disconnect.success=Local session removed. To revoke the session inside Telegram itself, open Telegram → Settings → Devices → Active sessions and terminate this session.

